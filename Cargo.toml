[workspace]
members = ["frext-core", "frext", "frext-term", "xtask"]
default-members = ["frext-core", "frext", "frext-term"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Fred Text — a super lightweight text editor written in Rust"
documentation = "https://github.com/fredsystems/frext/README.md"
readme = "README.md"
homepage = "https://github.com/fredsystems/frext"
repository = "https://github.com/fredsystems/frext"
license = "MIT"
keywords = ["editor", "text-editor", "gui", "egui"]
categories = ["text-editors", "gui"]

[workspace.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22.1"
criterion = "0.8.2"
crossterm = { version = "0.29.0", features = ["osc52"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
env_logger = "0.11.11"
fontdb = "0.24.0"
frext-core = { path = "frext-core" }
harfrust = "0.12.0"
harper-core = { version = "3.2.0", default-features = false, features = ["concurrent"] }
log = "0.4.35"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
regex = "1.13.1"
resvg = { version = "0.45.1", default-features = false }
rfd = "0.18.0"
rustix = { version = "1.1.6", features = ["event", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
trash = { version = "5.3.0", default-features = false, features = ["freedesktop"] }
ttf-parser = "0.25.1"
two-face = "0.5.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
